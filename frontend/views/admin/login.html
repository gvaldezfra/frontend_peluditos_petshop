<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <title>Peluditos Pet Shop ADMIN</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../../assets/favicon_io/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../assets/favicon_io/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../../assets/favicon_io/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="stylesheet" href="../../css/styles.css">
    <title>Document</title>
</head>

<body>
    <div id="header-container">
        <header id="header">
            <div class="header-content">
                <div class="header-logo">
                    <img class="img-logo" src="../../assets/img/logo.png" alt="logo" height="80px">
                    <img class="img-logo" src="../../assets/img/texto-peluditos.png" alt="texto-peluditos" height="50px">
                    <div class="name-container">
                    </div>
                </div>
                
            </div>
        </header>
    </div>

        <!----Main---->
    <main>
        <!----Seccion de productos-->
        <section class="login-container">
            <header class="login-header">
                <h2>Iniciar sesion</h2>

                <div class="form-container">
                    <form id="login-form">
                        <label>Nombre usuario</label>
                        <input type="text" name="username" id="username" placeholder="Ingrese el usuario" required>

                        <label>Contraseña</label>
                        <input type="password" name="password" id="password" placeholder="Ingrese la contraseña" required>
                        
                        <div>
                            <input type="submit" value="Acceso rapido">
                            <input type="submit" value="Ingresar">
                        </div>
                    </form>
                </div>
                
            </header>
        </section>

        <section class="seccion-mensaje">
            <div id="estado-mensaje">

            </div>
        </section>

    </main>

    <!----Footer---->
    <footer>
        <div class="footer-container">
            <p>&copy; 2026 Tienda Peluditos. Todos los derechos reservados.</p>
            <p> Desarrollado por: <strong>Matías Barboza y Guadalupe Valdez</strong></p>
        </div>
    </footer>

    <script src="../../js/admin/login.js"></script>
</body>
</html>
